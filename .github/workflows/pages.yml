name: Publicar maqueta en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # maquetas/kiosko.html se escribe sin <html>/<head> (formato de Artifact);
      # aquí se envuelve en un documento completo para servirlo como index.html.
      - name: Armar sitio
        run: |
          mkdir -p _site
          {
            printf '<!doctype html>\n<html lang="es">\n<head>\n'
            printf '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
            printf '</head>\n<body>\n'
            cat maquetas/kiosko.html
            printf '\n</body>\n</html>\n'
          } > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
