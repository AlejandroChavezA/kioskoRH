name: Publicar maqueta en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Las maquetas son documentos completos: se copian tal cual.
      # El kiosco también se sirve como index.html.
      - name: Armar sitio
        run: |
          mkdir -p _site
          cp maquetas/*.html _site/
          cp maquetas/kiosko.html _site/index.html
          if [ -d maquetas/assets ]; then cp -R maquetas/assets _site/; fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
