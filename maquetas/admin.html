<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiosko RH Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;1,400&display=swap">
<style>
/* Marca Visteon (Brand Guide 2026): Roboto; navy #00293F/#113B5E, teal #006283, blancos, gris #D6D8D1.
   Naranja #F5821F solo como resalte (dato clave, elemento activo). Logo y V-tag no se redibujan.
   Layout: panel de escritorio para trabajo prolongado. Barra lateral navy con las secciones del rol,
   barra superior blanca con el cambio de rol (Admin RH / Admin TI) y contenido en tarjetas blancas
   de esquinas redondas, más densas que en el kiosco pero de la misma familia. */
:root {
  --fondo: #F5F6F2;
  --panel: #FFFFFF;
  --borde: #DFE1DA;
  --gris-marca: #D6D8D1;
  --tinta: #00293F;
  --suave: #5F6E78;
  --teal: #006283;
  --teal-claro: #E1EFF2;
  --marino: #113B5E;
  --navy: #00293F;
  --naranja: #F5821F;
  --naranja-claro: #FDE3CC;
  --ok: #2E9D5B;
  --ok-claro: #DDF1E5;
  --espera: #FAA519;
  --espera-claro: #FEEFD2;
  --alto: #D64541;
  --alto-claro: #FBE3E1;
  --fuente: "Roboto", "Helvetica Neue", Arial, system-ui, sans-serif;
  --lado-w: 248px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--fuente); font-size: 15px; line-height: 1.45; color: var(--tinta); background: var(--fondo); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--naranja); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: var(--lado-w) 1fr; min-height: 100%; }
.lado {
  background: linear-gradient(180deg, #00293F 0%, #001D3A 100%); color: #fff;
  padding: 24px 16px; display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
}
.marca { display: flex; align-items: center; gap: 12px; padding: 0 8px 24px; font-weight: 700; font-size: 18px; line-height: 1.15; }
.marca small { display: block; font-weight: 400; font-size: 13px; opacity: .7; }
.sello { width: 42px; height: 42px; border-radius: 13px; background: #fff; color: var(--marino); display: grid; place-content: center; font-weight: 700; flex: none; }
.logo-oficial { height: 28px; width: auto; margin: 0 8px 18px; align-self: flex-start; }
.nav-titulo { font-size: 12px; color: rgba(255,255,255,.55); padding: 14px 12px 6px; letter-spacing: .04em; }
.nav-btn {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px;
  color: rgba(255,255,255,.82); font-weight: 400; text-align: left; width: 100%; position: relative;
}
.nav-btn svg { width: 22px; height: 22px; flex: none; }
.nav-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav-btn.on { background: #fff; color: var(--navy); font-weight: 700; }
.nav-btn .cuenta { margin-left: auto; font-size: 12px; font-weight: 700; background: var(--naranja); color: var(--navy); border-radius: 999px; padding: 1px 8px; }
.nav-btn.on .cuenta { background: var(--naranja-claro); }
.lado-pie { margin-top: auto; padding: 12px; font-size: 13px; color: rgba(255,255,255,.6); display: grid; gap: 8px; }
.lado-pie a { color: #fff; font-weight: 700; }

.principal { min-width: 0; display: grid; grid-template-rows: auto 1fr; }
.arriba {
  display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  padding: 20px 32px; background: var(--panel); border-bottom: 1px solid var(--borde);
  padding-right: max(32px, env(safe-area-inset-right, 0px));
  position: sticky; top: 0; z-index: 5;
}
.arriba h1 { font-size: 28px; font-weight: 300; line-height: 1.15; }
.arriba h1 small { display: block; font-size: 14px; color: var(--suave); margin-top: 2px; }
.arriba-der { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.rol { display: inline-flex; background: var(--fondo); border: 1px solid var(--borde); border-radius: 999px; padding: 4px; }
.rol button { padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--suave); }
.rol button.on { background: var(--navy); color: #fff; }
.yo { display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 1.25; }
.yo b { display: block; }
.yo span { color: var(--suave); font-size: 13px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--teal-claro); color: var(--teal); display: grid; place-content: center; font-weight: 700; flex: none; }
main { padding: 28px 32px 48px; padding-right: max(32px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; align-content: start; min-width: 0; }

/* ---------- Piezas ---------- */
.tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: 22px; padding: 22px 24px; min-width: 0; }
.tarjeta > h2, .cab h2 { font-size: 18px; font-weight: 700; }
.cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.cab p { color: var(--suave); font-size: 14px; }
.rejilla { display: grid; gap: 22px; }
.r-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.r-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.r-3-2 { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.r-2-3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); }
.dato { display: grid; gap: 4px; align-content: start; }
.dato .etq { font-size: 14px; color: var(--suave); }
.dato .valor { font-size: 40px; font-weight: 300; line-height: 1.05; }
.dato .nota { font-size: 13px; color: var(--suave); }
.dato .nota.alerta { color: #A3621A; font-weight: 700; }
.dato.clave .valor { color: var(--naranja); font-weight: 400; }
.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px;
  border-radius: 12px; font-weight: 700; font-size: 14px; background: var(--teal); color: #fff; white-space: nowrap;
}
.boton:hover { background: #00506B; }
.boton svg { width: 18px; height: 18px; }
.boton.claro { background: var(--panel); color: var(--tinta); border: 1px solid var(--borde); }
.boton.claro:hover { background: var(--fondo); }
.boton.peligro { background: var(--panel); color: var(--alto); border: 1px solid #EBC3C0; }
.boton.peligro:hover { background: var(--alto-claro); }
.boton.mini { min-height: 32px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.boton:disabled { opacity: .45; cursor: default; }
.estado { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.estado::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.estado.ok { background: var(--ok-claro); color: #1E7344; }
.estado.pend { background: var(--espera-claro); color: #8A5A07; }
.estado.no { background: var(--alto-claro); color: #A8322E; }
.estado.info { background: var(--teal-claro); color: var(--teal); }
.estado.gris { background: #EDEEEA; color: var(--suave); }
.aviso-linea { display: flex; gap: 10px; align-items: flex-start; background: var(--espera-claro); color: #6E4805; border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.aviso-linea svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.aviso-linea.error { background: var(--alto-claro); color: #8E2B27; }
.aviso-linea.bien { background: var(--ok-claro); color: #1E5F3A; }
.buscar { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 0 12px; min-height: 40px; min-width: min(320px, 100%); }
.buscar svg { width: 18px; height: 18px; color: var(--suave); flex: none; }
.buscar input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; padding: 8px 0; }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; }
.filtro { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--borde); background: var(--panel); font-size: 13px; font-weight: 700; color: var(--suave); }
.filtro.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.filtro .n { opacity: .7; margin-left: 4px; }
.campo { display: grid; gap: 6px; }
.campo label { font-size: 13px; font-weight: 700; }
.campo input, .campo select, .campo textarea {
  border: 1px solid var(--borde); border-radius: 12px; padding: 10px 12px; background: var(--panel); width: 100%;
}
.campo input:focus, .campo select:focus, .campo textarea:focus { outline: 0; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-claro); }
.campo textarea { min-height: 96px; resize: vertical; }
.campo .ayuda { font-size: 12px; color: var(--suave); }
.form { display: grid; gap: 14px; }
.form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* tablas */
.tabla-caja { overflow-x: auto; margin: 0 -24px; padding: 0 24px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 700; font-size: 12px; color: var(--suave); padding: 10px 12px; border-bottom: 1px solid var(--borde); white-space: nowrap; letter-spacing: .02em; }
td { padding: 12px; border-bottom: 1px solid #EEEFEA; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.clic { cursor: pointer; }
tbody tr.clic:hover td { background: #F8F9F6; }
tbody tr.sel td { background: var(--teal-claro); }
td .sub { display: block; font-size: 12px; color: var(--suave); }
td.der, th.der { text-align: right; }
.acciones { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.oculto-rol { color: var(--suave); font-style: italic; }

/* gráficas */
.grafica { position: relative; }
.grafica svg { width: 100%; height: auto; display: block; overflow: visible; }
.grafica text { font-family: var(--fuente); fill: var(--suave); font-size: 11px; }
.tip {
  position: absolute; pointer-events: none; background: var(--navy); color: #fff; border-radius: 10px; padding: 8px 10px;
  font-size: 12px; line-height: 1.35; transform: translate(-50%, calc(-100% - 10px)); white-space: nowrap; opacity: 0; transition: opacity .1s; z-index: 3;
}
.tip b { font-size: 14px; }
.tip.on { opacity: 1; }
.barras-h { display: grid; gap: 10px; }
.bh { display: grid; grid-template-columns: 120px 1fr 32px; align-items: center; gap: 10px; font-size: 14px; }
.bh .pista { height: 14px; border-radius: 0 4px 4px 0; background: transparent; }
.bh .barra { height: 100%; border-radius: 0 4px 4px 0; background: var(--teal); }
.bh.top .barra { background: var(--naranja); }
.bh .v { text-align: right; font-weight: 700; }
.leyenda-g { display: flex; gap: 16px; font-size: 12px; color: var(--suave); flex-wrap: wrap; }
.leyenda-g i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.medidor { height: 12px; border-radius: 999px; background: #ECEEE8; overflow: hidden; }
.medidor span { display: block; height: 100%; background: var(--teal); border-radius: 999px; }

/* listas y detalle */
.lista { display: grid; gap: 2px; }
.item { display: flex; align-items: center; gap: 14px; padding: 12px 10px; border-radius: 14px; text-align: left; width: 100%; }
.item:hover { background: #F8F9F6; }
.item.on { background: var(--teal-claro); }
.item .txt { flex: 1; min-width: 0; }
.item .txt b { display: block; font-size: 14px; }
.item .txt span { font-size: 13px; color: var(--suave); }
.item .ic { width: 36px; height: 36px; border-radius: 11px; background: var(--teal-claro); color: var(--teal); display: grid; place-content: center; flex: none; }
.item .ic svg { width: 20px; height: 20px; }
.detalle { display: grid; gap: 16px; align-content: start; }
.renglones { display: grid; border: 1px solid var(--borde); border-radius: 14px; overflow: hidden; }
.renglon { display: flex; justify-content: space-between; gap: 16px; padding: 10px 14px; font-size: 14px; border-bottom: 1px solid #EEEFEA; }
.renglon:last-child { border-bottom: 0; }
.renglon span { color: var(--suave); }
.renglon b { text-align: right; }
.hilo { display: grid; gap: 10px; }
.burbuja { max-width: 85%; border-radius: 16px; padding: 10px 14px; font-size: 14px; background: var(--fondo); justify-self: start; }
.burbuja.rh { justify-self: end; background: var(--teal-claro); }
.burbuja .de { display: block; font-size: 12px; font-weight: 700; color: var(--suave); margin-bottom: 2px; }
.vacio { text-align: center; color: var(--suave); padding: 40px 16px; display: grid; gap: 6px; justify-items: center; }
.vacio svg { width: 40px; height: 40px; color: var(--gris-marca); }

/* interruptor */
.switch { position: relative; width: 46px; height: 26px; border-radius: 999px; background: #D9DCD4; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,41,63,.25); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--teal); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }

/* vista previa de kiosco */
.kiosco-prev { background: repeating-linear-gradient(0deg, #F7F8F5 0 4px, #ECEEE8 4px 6px); border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
.kiosco-prev .chip { font-size: 12px; color: var(--suave); }
.tarjeta-k { border-radius: 22px; overflow: hidden; background: #fff; border: 2px solid var(--gris-marca); max-width: 340px; }
.tarjeta-k .arte { aspect-ratio: 5 / 3; display: grid; place-content: center; color: #fff; font-weight: 700; font-size: 22px; padding: 16px; text-align: center; }
.tarjeta-k .pie { padding: 12px 16px 16px; }
.tarjeta-k .pie b { display: block; font-size: 18px; }
.tarjeta-k .pie span { font-size: 14px; color: var(--suave); }
.campo-k { background: #fff; border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; border: 2px solid var(--gris-marca); }
.campo-k span { font-size: 13px; color: var(--suave); }
.campo-k b { font-size: 17px; }
.campo-k.nuevo { border-color: var(--naranja); }
.muestras { display: flex; gap: 8px; }
.muestra { width: 34px; height: 34px; border-radius: 10px; border: 3px solid transparent; }
.muestra.on { border-color: var(--naranja); }

/* importación */
.pasos-imp { display: grid; gap: 10px; }
.paso-imp { display: flex; gap: 12px; align-items: center; font-size: 14px; color: var(--suave); }
.paso-imp i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--borde); display: grid; place-content: center; font-style: normal; font-size: 12px; font-weight: 700; flex: none; }
.paso-imp.hecho { color: var(--tinta); }
.paso-imp.hecho i { background: var(--ok); border-color: var(--ok); color: #fff; }
.paso-imp.activo { color: var(--tinta); font-weight: 700; }
.paso-imp.activo i { border-color: var(--teal); color: var(--teal); animation: pulso 1s infinite; }
@keyframes pulso { 50% { box-shadow: 0 0 0 5px var(--teal-claro); } }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); opacity: 0;
  background: var(--navy); color: #fff; border-radius: 14px; padding: 12px 20px; font-weight: 700; font-size: 14px;
  transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; max-width: calc(100vw - 32px);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Responsivo ---------- */
@media (max-width: 1180px) {
  .r-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .r-3-2, .r-2-3, .r-2 { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .lado { position: static; height: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; align-items: center; padding: 12px 16px; gap: 6px; }
  .marca { padding: 0 8px 0 0; flex: none; }
  .marca span:last-child, .nav-titulo, .lado-pie, .logo-oficial { display: none; }
  .nav-btn { width: auto; flex: none; white-space: nowrap; padding: 9px 12px; }
  .arriba { padding: 16px; position: static; }
  main { padding: 18px 16px 40px; }
  .tarjeta { padding: 18px 16px; }
  .tabla-caja { margin: 0 -16px; padding: 0 16px; }
  .form-2 { grid-template-columns: 1fr; }
  .bh { grid-template-columns: 96px 1fr 28px; }
}
@media (max-width: 520px) { .r-4 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>

  function barras(datos, alto = 220) {

    const max = 200, paso = 50;
    const anchoZona = (W - iz - de) / datos.length, bw = Math.min(26, anchoZona * .56);
    const y = v => ar + (H - ar - ab) * (1 - v / max);
    let g = "";
    for (let v = 0; v <= max; v += paso) g += `<line x1="${iz}" x2="${W - de}" y1="${y(v)}" y2="${y(v)}" stroke="#E7E9E3" stroke-width="1"/><text x="${iz - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;

    });
    return `<div class="grafica"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sesiones en los kioscos por día, del 12 al 25 de noviembre. Hoy: ${datos.at(-1)[2]}.">${g}</svg></div>`;
  }

            <div class="renglon"><span>Sistema y aplicación</span><b class="num">1.6 GB</b></div>
          </div>
          <p style="font-size:13px;color:var(--suave);margin-top:12px">Los recibos y cartas no se guardan: se generan al momento.</p>
        </section>
        <section class="tarjeta">
          <div class="cab"><div><h2>Actividad reciente</h2><p>De la bitácora</p></div><button class="boton claro mini" data-ruta="bitacora">Ver bitácora</button></div>
          <div class="lista">${BITACORA.slice(0, 5).map(b => `<div class="item"><span class="txt"><b>${b[2]}</b><span>${b[1]}. ${b[3]}</span></span>${chip(TIPOS_BIT[b[4]])}<span class="estado gris">${b[0]}</span></div>`).join("")}</div>
        </section>
      </div>`;
    $("#main").onclick = null;
  };

  VISTAS.usuarios = () => {
    $("#main").innerHTML = `
      <div class="rejilla r-3-2">
        <section class="tarjeta">
          <div class="cab"><div><h2>Usuarios del panel</h2><p>Los operadores entran al kiosco con su número y PIN; no aparecen aquí</p></div></div>
          <div class="tabla-caja"><table>
            <thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Última vez</th><th>Acceso</th></tr></thead>
            <tbody>${USUARIOS.map((u, i) => `<tr>
              <td><b>${u.n}</b></td><td class="num">${u.u}</td>
              <td><select data-rolu="${i}" aria-label="Rol de ${u.n}" style="border:1px solid var(--borde);border-radius:10px;padding:6px 8px;background:#fff">${["Admin RH", "Admin TI"].map(r => `<option ${u.rol === r ? "selected" : ""}>${r}</option>`).join("")}</select></td>
              <td>${u.ult}</td><td><button class="switch" role="switch" aria-checked="${u.on}" data-acc="${i}" aria-label="Acceso de ${u.n}"></button></td></tr>`).join("")}</tbody>
          </table></div>
        </section>
        <section class="tarjeta">
          <div class="cab"><div><h2>Qué puede hacer cada rol</h2></div></div>
          <div class="renglones">
            <div class="renglon"><span>Aprobar vacaciones y responder reportes</span><b>RH</b></div>
            <div class="renglon"><span>Ver sueldos y saldos</span><b>RH</b></div>
            <div class="renglon"><span>Publicar comunicados</span><b>RH</b></div>
            <div class="renglon"><span>Usuarios, campos y parámetros</span><b>TI</b></div>
            <div class="renglon"><span>Importar datos y ver bitácora</span><b>TI</b></div>
          </div>
          <p style="font-size:13px;color:var(--suave);margin-top:12px">TI no ve sueldos y RH no cambia la estructura del sistema. Así cada cambio queda claro en la bitácora.</p>
        </section>
      </div>`;
    $("#main").onclick = ev => {
      const s = ev.target.closest("[data-acc]");
      if (s) { const u = USUARIOS[+s.dataset.acc]; u.on = !u.on; bitacora(yo(), u.on ? "Dio acceso" : "Quitó acceso", u.n, "config"); toast(u.on ? `${u.n.split(" ")[0]} ya puede entrar.` : `${u.n.split(" ")[0]} ya no puede entrar.`); VISTAS.usuarios(); }
    };
    $$("[data-rolu]").forEach(sel => sel.addEventListener("change", () => { const u = USUARIOS[+sel.dataset.rolu]; u.rol = sel.value; bitacora(yo(), "Cambió un rol", `${u.n}: ${u.rol}`, "config"); toast(`${u.n.split(" ")[0]} ahora es ${u.rol}.`); }));
  };

  VISTAS.campos = () => {
    $("#main").innerHTML = `
      <div class="rejilla r-3-2">
        <section class="tarjeta">
          <div class="cab"><div><h2>Campos disponibles</h2><p>Al activar uno, aparece en "Mis datos" del kiosco y en la ficha del empleado</p></div></div>
          <div class="tabla-caja"><table>
            <thead><tr><th>Campo</th><th>Tipo</th><th>Obligatorio</th><th>Activo</th></tr></thead>
            <tbody>${CAMPOS.map((c, i) => `<tr><td><b>${c.l}</b><span class="sub num">${c.k}</span></td><td>${c.tipo}</td>
              <td><button class="switch" role="switch" aria-checked="${c.ob}" data-ob="${i}" aria-label="${c.l} obligatorio" ${c.on ? "" : "disabled"} style="${c.on ? "" : "opacity:.4"}"></button></td>
              <td><button class="switch" role="switch" aria-checked="${c.on}" data-on="${i}" aria-label="Activar ${c.l}"></button></td></tr>`).join("")}</tbody>
          </table></div>
          <p style="font-size:13px;color:var(--suave);margin-top:12px">Para un campo que no está en la lista, pídelo a desarrollo: se deja preparado y aquí solo se activa.</p>
        </section>
        <section class="tarjeta">
          <div class="cab"><div><h2>Así se ve en el kiosco</h2><p>Mis datos, campos extra</p></div></div>
          <div class="kiosco-prev">${CAMPOS.filter(c => c.on).map(c => `<div class="campo-k ${c.k === st.recien ? "nuevo" : ""}"><span>${c.l}${c.ob ? " (obligatorio)" : ""}</span><b>${c.ej}</b></div>`).join("") || `<div class="vacio"><b>Sin campos extra</b><span>Activa uno para verlo aquí.</span></div>`}</div>
        </section>
      </div>`;
    $("#main").onclick = ev => {
      const a = ev.target.closest("[data-on]"), o = ev.target.closest("[data-ob]");
      if (a) { const c = CAMPOS[+a.dataset.on]; c.on = !c.on; if (!c.on) c.ob = false; st.recien = c.on ? c.k : null; bitacora(yo(), "Cambió un campo", `${c.on ? "Activó" : "Desactivó"} "${c.l}"`, "config"); toast(c.on ? `"${c.l}" ya aparece en los kioscos.` : `"${c.l}" ya no aparece.`); VISTAS.campos(); }
      else if (o && !o.disabled) { const c = CAMPOS[+o.dataset.ob]; c.ob = !c.ob; VISTAS.campos(); }
    };
  };

  VISTAS.integraciones = () => {
    const PASOS = ["Archivo recibido", "Revisión de columnas y tipos", "Comparación con lo publicado", "Listo para publicar"];
    const imp = st.imp;
    let panel;
    if (!imp) panel = `
      <div class="detalle">
        <p style="color:var(--suave)">Sube el Excel de plantilla o la exportación de A3. Primero se revisa en una zona de pruebas; si algo falla, no se publica nada.</p>
        <button class="boton" id="cargar">${ico("i-subir")}Cargar archivo de ejemplo</button>
        <div class="aviso-linea" style="background:var(--teal-claro);color:var(--teal)">${ico("i-sync")}<span>En esta fase la carga es manual. La importación automática a las 6:00 y la conexión directa con A3 van en la fase 2.</span></div>
      </div>`;
    else panel = `
      <div class="detalle">
        <div class="renglones"><div class="renglon"><span>Archivo</span><b class="num">plantilla_2026-11-26.xlsx</b></div><div class="renglon"><span>Tipo</span><b>Excel de plantilla</b></div></div>
        <div class="pasos-imp">${PASOS.map((p, i) => `<div class="paso-imp ${i < imp.paso ? "hecho" : i === imp.paso ? "activo" : ""}"><i>${i < imp.paso ? "✓" : i + 1}</i>${p}</div>`).join("")}</div>
        ${imp.paso >= PASOS.length - 1 ? `
          <div class="aviso-linea bien">${ico("i-palomita")}<span><b>1,249 registros sin errores.</b> 1 alta nueva: Sofía Jiménez Rangel, Línea 2. Ninguna baja.</span></div>
          <div class="aviso-linea">${ico("i-alerta")}<span>1 empleado sin foto. Puede entrar al kiosco igual; se le muestra un avatar.</span></div>
          <div class="acciones" style="justify-content:flex-start"><button class="boton" id="publicar-imp">Publicar datos</button><button class="boton claro" id="descartar-imp">Descartar</button></div>` : ""}
      </div>`;
    $("#main").innerHTML = `
      <div class="rejilla r-2-3">
        <section class="tarjeta"><div class="cab"><div><h2>Nueva importación</h2></div></div>${panel}</section>
        <section class="tarjeta">
          <div class="cab"><div><h2>Historial</h2><p>Cada carga queda registrada, haya salido bien o no</p></div></div>
          <div class="tabla-caja"><table>
            <thead><tr><th>Archivo</th><th>Cuándo</th><th>Resultado</th></tr></thead>
            <tbody>${IMPORTS.map(i => `<tr><td><b class="num">${i.f}</b><span class="sub">${i.fuente}</span></td><td style="white-space:nowrap">${i.hora}</td>
              <td>${chip(i.e === "ok" ? ["Publicado", "ok"] : i.e === "pend" ? ["Publicado con avisos", "pend"] : ["No se publicó", "no"])}<span class="sub" style="margin-top:4px">${i.msg}</span></td></tr>`).join("")}</tbody>
          </table></div>
        </section>
      </div>`;
    $("#main").onclick = ev => {
      if (ev.target.closest("#cargar")) {
        st.imp = { paso: 0 }; VISTAS.integraciones();
        const avanza = () => { if (!st.imp || st.ruta !== "integraciones") return; st.imp.paso++; VISTAS.integraciones(); if (st.imp.paso < 3) setTimeout(avanza, 700); };
        setTimeout(avanza, 700);
      }
      if (ev.target.closest("#publicar-imp")) {
        IMPORTS.unshift({ f: "plantilla_2026-11-26.xlsx", fuente: "Excel de plantilla", hora: "Ahora", e: "ok", msg: "1,249 registros. 1 alta." });
        bitacora(yo(), "Importó la plantilla", "1,249 registros", "datos"); st.imp = null; toast("Publicado. Los kioscos ya muestran los datos nuevos."); VISTAS.integraciones();
      }
      if (ev.target.closest("#descartar-imp")) { st.imp = null; toast("Descartado. No se cambió nada."); VISTAS.integraciones(); }
    };
  };

  VISTAS.bitacora = () => {
    const tipos = [["todo", "Todo"], ["accion", "Acciones de RH"], ["sensible", "Datos sensibles"], ["alerta", "Alertas"], ["config", "Configuración"], ["datos", "Datos"]];
    const filas = BITACORA.filter(b => st.bitFiltro === "todo" || b[4] === st.bitFiltro);
    $("#main").innerHTML = `
      <div class="filtros">${tipos.map(([k, n]) => `<button class="filtro ${st.bitFiltro === k ? "on" : ""}" data-f="${k}">${n}</button>`).join("")}</div>
      <section class="tarjeta">
        <div class="tabla-caja"><table>
          <thead><tr><th>Cuándo</th><th>Quién</th><th>Qué hizo</th><th>Detalle</th><th>Tipo</th></tr></thead>
          <tbody>${filas.map(b => `<tr><td class="num" style="white-space:nowrap">${b[0]}</td><td>${b[1]}</td><td><b>${b[2]}</b></td><td>${b[3]}</td><td>${chip(TIPOS_BIT[b[4]])}</td></tr>`).join("") || `<tr><td colspan="5"><div class="vacio"><b>Sin registros de este tipo</b></div></td></tr>`}</tbody>
        </table></div>
        <p style="font-size:13px;color:var(--suave);margin-top:12px">La bitácora no se puede editar ni borrar desde el panel. Se guarda 5 años.</p>
      </section>`;
    $("#main").onclick = ev => { const f = ev.target.closest("[data-f]"); if (f) { st.bitFiltro = f.dataset.f; VISTAS.bitacora(); } };
  };

  VISTAS.parametros = () => {
    const p = st.params;
    const campo = (id, l, v, suf, ayuda) => `<div class="campo"><label for="${id}">${l}</label><div style="display:flex;align-items:center;gap:10px"><input id="${id}" type="number" min="1" value="${v}" style="max-width:120px"><span>${suf}</span></div><span class="ayuda">${ayuda}</span></div>`;
    $("#main").innerHTML = `
      <div class="rejilla r-2">
        <section class="tarjeta"><div class="cab"><div><h2>Kiosco</h2></div></div><div class="form">
          ${campo("p-sesion", "Cerrar la sesión sin actividad", p.sesion, "minutos", "En una pantalla compartida, menos es más seguro.")}
          ${campo("p-pin", "Intentos de PIN antes de bloquear", p.pin, "intentos", "Después se bloquea 15 minutos y queda en la bitácora.")}
        </div></section>
        <section class="tarjeta"><div class="cab"><div><h2>Reglas y retención</h2></div></div><div class="form">
          ${campo("p-anticip", "Anticipación mínima para pedir vacaciones", p.anticip, "días", "El calendario del kiosco no deja elegir antes.")}
          ${campo("p-ret", "Tiempo que se guarda la bitácora", p.retencion, "años", "Confírmalo con legal antes de cambiarlo.")}
        </div></section>
      </div>
      <div><button class="boton" id="guardar-p">Guardar cambios</button></div>`;
    $("#main").onclick = ev => {
      if (!ev.target.closest("#guardar-p")) return;
      const vals = { sesion: +$("#p-sesion").value, pin: +$("#p-pin").value, anticip: +$("#p-anticip").value, retencion: +$("#p-ret").value };
      if (Object.values(vals).some(v => !(v >= 1))) return toast("Todos los valores deben ser 1 o más.");
      st.params = vals; bitacora(yo(), "Cambió parámetros", `Sesión ${vals.sesion} min, PIN ${vals.pin} intentos`, "config"); toast("Guardado. Los kioscos usan los valores nuevos desde la siguiente sesión.");
    };
  };

  // ================= Arranque =================
  const [rol0, ruta0] = (location.hash.slice(1) || "rh-inicio").split("-");
  ir(ruta0 || "inicio", NAV[rol0] ? rol0 : "rh");
})();
</script>
</body>
</html>
